[workspace]
members = ["cargo:."]

# cargo-dist is not the release assembler: a binary-only archive omits the
# mandatory redistributable runtime. Use packaging/macos/release.py instead.
[dist]
cargo-dist-version = "0.31.0"
ci = []
installers = []
targets = ["aarch64-apple-darwin"]
unix-archive = ".tar.gz"
install-updater = false
publish-jobs = []
