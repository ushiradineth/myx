name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
  CARGO_TERM_COLOR: always
jobs:
  mac-software:
    name: Mac software gates
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Format
        run: nix develop --no-update-lock-file -c cargo fmt --all -- --check
      - name: Clippy
        run: nix develop --no-update-lock-file -c cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Software tests (live/native ignored)
        run: nix develop --no-update-lock-file -c cargo test --locked --workspace --all-targets
      - name: Packaging fixture tests
        run: nix develop --no-update-lock-file -c python3 -m unittest discover -s packaging/macos/tests
      - name: Whitespace
        run: git diff --check
# Release assembly, signing, SDK/account/native/media/GUI and LaunchAgent
# acceptance are explicit owner gates. CI neither publishes nor registers.
