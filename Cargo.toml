[package]
name = "myx"
version = "0.5.0"
edition = "2021"
description = "A lean, beautiful terminal Spotify player"
authors = ["Haseeb Khalid"]
license = "MIT"
repository = "https://github.com/HaseebKhalid1507/Myx"
homepage = "https://github.com/HaseebKhalid1507/Myx"
readme = "README.md"
keywords = ["spotify", "tui", "music", "player", "ratatui"]
categories = ["command-line-utilities", "multimedia::audio"]
default-run = "myx"

[workspace]
members = ["crates/soloist-runtime"]
default-members = ["."]
resolver = "2"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
tui-textarea-2 = { version = "0.12", default-features = false, features = ["crossterm"] }
image = "0.25"
color-thief = "0.2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
flume = "0.12"
rustfft = "6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
open = "5"
fs2 = "0.4"
libc = "0.2"
souvlaki = { version = "0.8.3", default-features = false, features = ["pollster", "zbus", "zvariant"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
log = { version = "0.4.33", features = ["std"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
soloist-runtime = { path = "crates/soloist-runtime" }

[target.'cfg(windows)'.dependencies]
windows-win = "3.0.0"

# Macos-only
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30.13"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "myx"
path = "src/main.rs"

# Public theme/protocol examples.
[[example]]
name = "theme_demo"
path = "examples/theme_demo.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Debian packaging (audit H7): the binary links libasound2 (librespot ALSA) and
# libssl3 (native-tls), so the .deb must declare them or `dpkg -i` installs a
# binary that fails to start with missing shared libraries.
[package.metadata.deb]
depends = "libasound2, libssl3"
section = "sound"
priority = "optional"
assets = [
    ["target/release/myx", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/myx/README.md", "644"],
    ["LICENSE", "usr/share/doc/myx/LICENSE", "644"],
    ["NOTICE", "usr/share/doc/myx/NOTICE", "644"],
]
