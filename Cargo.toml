[package]
name = "myx"
version = "0.5.0-preview.4"
edition = "2021"
description = "A daemon-first Spotify player with an attachable terminal client"
authors = ["Haseeb Khalid"]
license = "MIT"
repository = "https://github.com/HaseebKhalid1507/Myx"
homepage = "https://github.com/HaseebKhalid1507/Myx"
readme = "README.md"
keywords = ["spotify", "tui", "music", "player", "ratatui"]
categories = ["command-line-utilities", "multimedia::audio"]
default-run = "myx"

[workspace]
members = ["crates/soloist-runtime"]
default-members = ["."]
resolver = "2"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
tui-textarea-2 = { version = "0.12", default-features = false, features = ["crossterm"] }
image = "0.25"
color-thief = "0.2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
flume = "0.12"
rustfft = "6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
open = "5"
fs2 = "0.4"
libc = "0.2"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
log = { version = "0.4.33", features = ["std"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
soloist-runtime = { path = "crates/soloist-runtime" }

# Macos-only
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30.13"
souvlaki = { version = "0.8.3", default-features = false }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "myx"
path = "src/main.rs"

# Public theme example.
[[example]]
name = "theme_demo"
path = "examples/theme_demo.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
